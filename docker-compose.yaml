services:
  # Broker de Mensageria
  broker:
    image: eclipse-mosquitto:2
    container_name: alarm-mqtt-broker
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always

  # Banco de Dados
  database:
    image: postgres:15-alpine
    container_name: alarm-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-alarm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # Event Service (API de entrada)
  event-service:
    image: golang:1.24-alpine
    container_name: event-service-app
    working_dir: /app
    ports:
      - "${EVENT_SERVICE_PORT:-8080}:8080"
    volumes:
      - ./event-service:/app
    depends_on:
      - broker
    command: tail -f /dev/null

  # Alarm Service (Processamento e persistência)
  alarm-service:
    image: golang:1.24-alpine
    container_name: alarm-service-app
    working_dir: /app
    ports:
      - "${ALARM_SERVICE_PORT:-8081}:8081"
    volumes:
      - ./alarm-service:/app
    depends_on:
      - broker
      - database
    command: tail -f /dev/null