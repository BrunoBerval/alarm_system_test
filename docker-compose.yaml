services:
  # Broker de Mensageria
  broker:
    image: eclipse-mosquitto:2
    container_name: alarm-mqtt-broker
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Banco de Dados
  database:
    image: postgres:15-alpine
    container_name: alarm-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-alarm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-alarm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Event Service (API de entrada com worker pool configurado via ambiente)
  event-service:
    image: golang:1.24-alpine
    container_name: event-service-app
    working_dir: /app
    environment:
      - EVENT_WORKERS=${EVENT_WORKERS:-3}
      - EVENT_BUFFER_SIZE=${EVENT_BUFFER_SIZE:-50}
    ports:
      - "${EVENT_SERVICE_PORT:-8082}:8080"
    volumes:
      - ./event-service:/app
    depends_on:
      broker:
        condition: service_healthy
    restart: always
    command: tail -f /dev/null

  # Alarm Service (Processamento e persistência)
  alarm-service:
    image: golang:1.24-alpine
    container_name: alarm-service-app
    working_dir: /app
    ports:
      - "${ALARM_SERVICE_PORT:-8081}:8081"
    volumes:
      - ./alarm-service:/app
    depends_on:
      broker:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: always
    command: tail -f /dev/null